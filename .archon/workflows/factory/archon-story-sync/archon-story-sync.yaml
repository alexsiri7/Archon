name: archon-story-sync
description: |
  Use when: ops/cron/story-sync.sh found that a game's story bible changed in Annie. It passes
  the exported Markdown directory as the argument.
  Does: mirrors the export into story/annie/ -> an LLM reads what changed and promotes only the
        SETTLED parts into story/CANON.md (the story the game implements); tentative, hedged or
        open material goes to story/PENDING.md with the reason -> opens a docs-only PR -> files one
        implementation issue for the factory when the canon change alters what the game must do.
  NOT for: writing story (Annie is the source), or implementing the game change itself.

provider: claude
model: sonnet

nodes:
  - id: import
    bash: |
      set -euo pipefail
      SRC=$(printf '%s' "$ARGUMENTS" | awk '{print $1}')
      if [ ! -f "$SRC/README.md" ]; then echo "no Annie export at '$SRC'" >&2; exit 1; fi
      mkdir -p story
      rm -rf story/annie
      cp -r "$SRC" story/annie
      git add -A story/annie
      if git diff --cached --quiet -- story/annie; then
        echo "NO_CHANGES"
      else
        git diff --cached -- story/annie > "$ARTIFACTS_DIR/annie.diff"
        git diff --cached --stat -- story/annie > "$ARTIFACTS_DIR/annie.stat"
        echo "CHANGED"
      fi
    timeout: 60000

  - id: curate
    when: "$import.output == 'CHANGED'"
    depends_on: [import]
    context: fresh
    model: claude-opus-5-5
    allowed_tools: [Read, Write, Edit, Glob, Grep]
    prompt: |
      You keep this game's **canon**: the story the game implements. The author writes and
      brainstorms the story in Annie; a mirror of it has just been updated in `story/annie/`.
      Your job is to tell what in it is *settled* and bring only that into the canon.

      ## Read first

      - `$ARTIFACTS_DIR/annie.diff`: what changed in the mirror since the last sync (on the first
        sync, everything is new).
      - All of `story/annie/`: the current story bible, for context.
      - `story/CANON.md` and `story/PENDING.md`, if they exist.
      - How the game tells the story today: `openspec/specs/` (especially any story, world or
        content spec), the content data (e.g. `frontend/src/content/`), `CLAUDE.md`,
        `docs/design/STYLE.md`. Note where names and facts were already decided in the game.

      ## What counts as settled

      Settled: stated plainly as fact or decision, concrete (who, where, what happens, what the
      player must do), and not contradicted elsewhere in the bible.

      Tentative, so it stays out of canon:
      - hedged: "idea", "spitballing", "maybe", "could", "might", "possibly", "leaning", "not
        settled", "TBD", "still open", "?", "details still hard to pinpoint";
      - superseded: anything marked "earlier idea" or "(was: …)";
      - a placeholder ("name TBD (placeholder: X)") does not change a name the game already uses;
      - a story object tagged `open`, and NOTE objects such as "Open questions" (context only,
        though an answer the author wrote there may settle something);
      - something that contradicts another part of the bible.

      Work sentence by sentence. A settled object can hold tentative sentences: take only the
      settled ones.

      ## Outline scenes in the story format

      `story/annie/outline/` holds the manuscript outline: per act, a PART with four chapters
      (Puzzle chart, Rooms, Cutscenes, Conversations), one scene each, written one line per
      beat in a fixed format (`GOAL:`/step lines, `ROOM:`/`*`/`-` lines, `CUTSCENE:` with
      `NAME:`, `>`, `CAMERA:`, `MUSIC:`, `[effect]` lines, `CHARACTER:`/`KNOWS:`/`MUST SAY:` lines).
      For these scenes the **status** decides, not the wording:
      - `final`: settled. Copy the scene's lines into `story/CANON.md` under the act, verbatim
        and in the same format (do not summarise them into prose), except `OPEN:` lines, which
        go to PENDING. These scenes are the most exact spec the game has: in `what_changes`
        and `acceptance`, name each final scene that differs from the game's content today.
      - `outline`, `draft`, `revised`: not settled. List each in PENDING by act and title, one
        line, without copying its contents, and never file implementation work for it.

      When settled Annie material contradicts the canon or the game, **Annie wins**: the author
      changed their mind. Record the contradiction, so the implementation issue can deal with it.
      When the game has decided something Annie leaves open (a name, for instance), keep the
      game's decision in canon and list it in PENDING as "decided in the game, open in Annie".

      ## Write

      1. `story/CANON.md`: the whole canon, rewritten, not appended to. If it doesn't exist yet,
         seed it from the story the game tells today, then apply the settled Annie material.
         Organise it for implementers:
         - premise and world;
         - characters (one short entry each: who they are, what they want, where they appear);
         - places;
         - acts and their puzzles as steps: goal, the obstacles, how each is solved, what it
           unlocks;
         - systems the story relies on.
         Plain prose and lists, no speculation. At the top, write: "Generated by the story sync
         from Annie. Change the story in Annie, not here."
      2. `story/PENDING.md`: every tentative item you left out, grouped by topic, each with one
         line on why it isn't settled. Include the game-vs-Annie conflicts. Same header line.
      3. `$ARTIFACTS_DIR/sync.json`, exactly:
         ```json
         {"summary": "<2-4 sentences: what changed in the canon this sync>",
          "canon_changes": ["<one line per change to CANON.md>"],
          "implement": {
            "needed": true,
            "title": "<imperative, under 80 chars, e.g. 'Rework Act 1 around the Three Crows' conditions'>",
            "what_changes": "<what the game must now do differently, by spec/room/character/puzzle>",
            "conflicts": ["<where canon now contradicts current specs, content or code>"],
            "acceptance": ["<checkable criteria, written from the player's view where possible>"]
          }}
         ```
         Set `implement.needed` to false when the canon change doesn't change what the game must
         do: wording only, or material for acts that aren't built yet. Then leave out the other
         `implement` fields. Large changes still go into one issue: the factory splits it.

      Do not edit anything outside `story/CANON.md`, `story/PENDING.md` and the artifacts dir.
      Then reply with the summary.

  - id: publish
    when: "$import.output == 'CHANGED'"
    depends_on: [curate]
    bash: |
      set -euo pipefail
      J="$ARTIFACTS_DIR/sync.json"
      jq -e '.summary and (.implement | type == "object")' "$J" >/dev/null || { echo "curate wrote no readable $J" >&2; exit 1; }
      ORIGIN_REPO=$(git remote get-url origin | sed -E 's#^.*[:/]([^/]+/[^/]+)$#\1#; s#\.git$##')
      DAY=$(date -u +%F)
      git add -A story
      git commit -q -m "Story sync from Annie ($DAY)" -m "$(jq -r .summary "$J")"
      git push -q -u origin HEAD
      PR_BODY=$(jq -r '[
        "Story sync from Annie. `story/annie/` is the raw mirror; `story/CANON.md` holds only what the sync judged **settled**; tentative material is in `story/PENDING.md` with the reason.",
        "", "## Summary", .summary, "",
        "## Canon changes", (.canon_changes | map("- \(.)") | join("\n")), "",
        "Docs only: no code changes. Generated by `archon-story-sync`."
      ] | join("\n")' "$J")
      PR_URL=$(gh pr create --repo "$ORIGIN_REPO" --base "$BASE_BRANCH" \
        --title "Story sync from Annie ($DAY)" --body "$PR_BODY")
      echo "STORY_SYNC_PR: $PR_URL"
      if [ "$(jq -r .implement.needed "$J")" != true ]; then
        echo "STORY_SYNC_NOTHING: the canon change needs no game change"
        exit 0
      fi
      ISSUE_BODY=$(jq -r --arg pr "$PR_URL" '.implement as $i | [
        "The story changed in Annie. The story sync promoted the settled parts into `story/CANON.md` (\($pr)). Implement them in the game.",
        "",
        "**Order of work:** update the openspec specs to match the canon first, then the content and code. Read `story/CANON.md` from the PR above, or from main once it is merged. `story/PENDING.md` lists what is not settled: do not build it.",
        "", "## What changes", $i.what_changes, "",
        "## Conflicts with the current game",
        (if ($i.conflicts // []) == [] then "None found." else ($i.conflicts | map("- \(.)") | join("\n")) end),
        "", "## Acceptance criteria",
        ($i.acceptance | map("- [ ] \(.)") | join("\n")),
        "- [ ] The openspec specs describe the new story and pass validation.",
        "- [ ] Existing tests pass, and tests cover the new or changed puzzles."
      ] | join("\n")' "$J")
      ISSUE_URL=$(gh issue create --repo "$ORIGIN_REPO" --title "$(jq -r .implement.title "$J")" --body "$ISSUE_BODY")
      echo "STORY_SYNC_ISSUE: $ISSUE_URL"
    timeout: 120000
